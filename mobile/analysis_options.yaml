# Konfigurasi analyzer Dart untuk aplikasi Bank Mini Nasabah.
#
# Aturan tambahan di bawah dipilih agar konsisten dengan gaya kode yang sudah
# dipakai: satu tanda kutip, koma di akhir agar `dart format` rapi, dan tidak
# ada `print` yang tertinggal di jalur produksi.

include: package:flutter_lints/flutter.yaml

linter:
  rules:
    prefer_single_quotes: true
    require_trailing_commas: true

analyzer:
  errors:
    # `print` di kode aplikasi hampir selalu sisa debug. Jadikan error agar
    # tidak lolos ke build rilis.
    avoid_print: error
